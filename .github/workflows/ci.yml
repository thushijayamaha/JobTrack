name: JobTrack CI/CD

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build


  backend:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::020529562689:role/JobTrack-GitHub-CD-Role
          aws-region: us-east-1

      - name: Deploy using AWS Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-056357399dc0fc3e0" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy JobTrack from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/JobTrack",
              "git pull origin main",
              "cd backend",
              "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
              "php artisan migrate --force",
              "php artisan config:clear",
              "php artisan cache:clear",
              "php artisan route:clear",
              "php artisan view:clear",
              "cd ../frontend",
              "npm ci",
              "npm run build",
              "sudo rm -rf /var/www/jobtrack-frontend/*",
              "sudo cp -r dist/jobtrack-frontend/browser/. /var/www/jobtrack-frontend/",
              "sudo chown -R www-data:www-data /var/www/jobtrack-frontend",
              "sudo chmod -R 755 /var/www/jobtrack-frontend",
              "sudo systemctl reload php8.5-fpm",
              "sudo systemctl reload nginx"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-056357399dc0fc3e0"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-056357399dc0fc3e0" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'