name: JobTrack CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/jobtrack-frontend/browser


  backend:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    # Deploy only for pushes to main, not pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/jobtrack-deploy-key
          chmod 600 ~/.ssh/jobtrack-deploy-key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload frontend to EC2
        run: |
          scp -i ~/.ssh/jobtrack-deploy-key -r frontend-build/. \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/frontend-build/"

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/jobtrack-deploy-key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
              set -e

              cd /home/ubuntu/JobTrack
              git pull origin main

              cd backend
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
              php artisan migrate --force
              php artisan config:clear
              php artisan cache:clear
              php artisan route:clear
              php artisan view:clear

              sudo rm -rf /var/www/jobtrack-frontend/*
              sudo cp -r /home/ubuntu/frontend-build/. /var/www/jobtrack-frontend/
              sudo chown -R www-data:www-data /var/www/jobtrack-frontend
              sudo chmod -R 755 /var/www/jobtrack-frontend

              sudo systemctl reload php8.5-fpm
              sudo systemctl reload nginx
          EOF